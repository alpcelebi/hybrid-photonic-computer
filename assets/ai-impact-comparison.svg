<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1520"/>
    </linearGradient>
    <linearGradient id="hybridBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#ffb800"/>
    </linearGradient>
    <linearGradient id="todayBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#444444"/>
      <stop offset="100%" style="stop-color:#666666"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
  </g>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2">ENERGY PER MAC: TODAY'S GPU vs PHOTONIC CORE</text>
  <text x="450" y="58" text-anchor="middle" fill="#aaaaaa" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11">Illustrative energy model (v1.1) · N = 64, f = 10 GBd, base-4 digit slicing (4 passes) · memory traffic excluded</text>

  <!-- Legend -->
  <rect x="470" y="70" width="16" height="10" rx="2" fill="#555555"/>
  <text x="492" y="80" fill="#aaaaaa" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">Today (GPU, FP8)</text>
  <rect x="610" y="70" width="16" height="10" rx="2" fill="url(#hybridBar)"/>
  <text x="632" y="80" fill="#aaaaaa" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">Hybrid Photonic (model)</text>

  <text x="450" y="472" text-anchor="middle" fill="#666666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9">← Lower is better · GPU reference: NVIDIA H100 SXM, ~990 TMAC/s dense FP8 at 700 W</text>

  <!-- ====== ROW 1: Thermo-optic · 1λ ====== -->
  <text x="185" y="112" text-anchor="end" fill="#ffb800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600">Thermo-optic · 1λ</text>
  <text x="185" y="124" text-anchor="end" fill="#666666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">8-bit MAC, core only</text>
  <rect x="195" y="100" width="400" height="13" rx="3" fill="#444444" opacity="0.7"/>
  <text x="603" y="111" fill="#888888" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">GPU ~707 fJ</text>
  <rect x="195" y="116" width="497" height="13" rx="3" fill="url(#hybridBar)" filter="url(#glow)"/>
  <text x="700" y="127" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">879 fJ</text>
  <rect x="800" y="100" width="80" height="30" rx="4" fill="#ff405720" stroke="#ff4057" stroke-width="1"/>
  <text x="840" y="112" text-anchor="middle" fill="#ff4057" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700">0.8×</text>
  <text x="840" y="124" text-anchor="middle" fill="#ff4057" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">worse</text>

  <!-- ====== ROW 2: Thermo-optic · 16λ ====== -->
  <text x="185" y="167" text-anchor="end" fill="#ffb800" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600">Thermo-optic · 16λ</text>
  <text x="185" y="179" text-anchor="end" fill="#666666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">WDM amortises tuning</text>
  <rect x="195" y="155" width="400" height="13" rx="3" fill="#444444" opacity="0.7"/>
  <text x="603" y="166" fill="#888888" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">GPU ~707 fJ</text>
  <rect x="195" y="171" width="83" height="13" rx="3" fill="url(#hybridBar)" filter="url(#glow)"/>
  <text x="603" y="182" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">147 fJ</text>
  <rect x="800" y="155" width="80" height="30" rx="4" fill="#00ff8820" stroke="#00ff88" stroke-width="1"/>
  <text x="840" y="167" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700">4.8×</text>
  <text x="840" y="179" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">less energy</text>

  <!-- ====== ROW 3: Electro-optic · 1λ ====== -->
  <text x="185" y="222" text-anchor="end" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600">Electro-optic · 1λ</text>
  <text x="185" y="234" text-anchor="end" fill="#666666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">TFLN / phase-change weights</text>
  <rect x="195" y="210" width="400" height="13" rx="3" fill="#444444" opacity="0.7"/>
  <text x="603" y="221" fill="#888888" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">GPU ~707 fJ</text>
  <rect x="195" y="226" width="58" height="13" rx="3" fill="url(#hybridBar)" filter="url(#glow)"/>
  <text x="603" y="237" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">103 fJ</text>
  <rect x="800" y="210" width="80" height="30" rx="4" fill="#00ff8820" stroke="#00ff88" stroke-width="1"/>
  <text x="840" y="222" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700">6.9×</text>
  <text x="840" y="234" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">less energy</text>

  <!-- ====== ROW 4: Electro-optic · 16λ ====== -->
  <text x="185" y="277" text-anchor="end" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600">Electro-optic · 16λ</text>
  <text x="185" y="289" text-anchor="end" fill="#666666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">best modelled case</text>
  <rect x="195" y="265" width="400" height="13" rx="3" fill="#444444" opacity="0.7"/>
  <text x="603" y="276" fill="#888888" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">GPU ~707 fJ</text>
  <rect x="195" y="281" width="56" height="13" rx="3" fill="url(#hybridBar)" filter="url(#glow)"/>
  <text x="603" y="292" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">98 fJ</text>
  <rect x="800" y="265" width="80" height="30" rx="4" fill="#00ff8820" stroke="#00ff88" stroke-width="1"/>
  <text x="840" y="277" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700">7.2×</text>
  <text x="840" y="289" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">less energy</text>

  <!-- ====== ROW 5: Facility energy ====== -->
  <text x="185" y="332" text-anchor="end" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600">Facility energy</text>
  <text x="185" y="344" text-anchor="end" fill="#666666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">Amdahl, φ = 0.5</text>
  <rect x="195" y="320" width="400" height="13" rx="3" fill="#444444" opacity="0.7"/>
  <text x="603" y="331" fill="#888888" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">100%</text>
  <rect x="195" y="336" width="228" height="13" rx="3" fill="url(#hybridBar)" filter="url(#glow)"/>
  <text x="603" y="347" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">~57%</text>
  <rect x="800" y="320" width="80" height="30" rx="4" fill="#00ff8820" stroke="#00ff88" stroke-width="1"/>
  <text x="840" y="332" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700">≤ ~43%</text>
  <text x="840" y="344" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">less</text>

  <!-- ====== ROW 6: Cooling water ====== -->
  <text x="185" y="387" text-anchor="end" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600">Cooling water</text>
  <text x="185" y="399" text-anchor="end" fill="#666666" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">scales with heat</text>
  <rect x="195" y="375" width="400" height="13" rx="3" fill="#444444" opacity="0.7"/>
  <text x="603" y="386" fill="#888888" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">100%</text>
  <rect x="195" y="391" width="228" height="13" rx="3" fill="url(#hybridBar)" filter="url(#glow)"/>
  <text x="603" y="402" fill="#00d4ff" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10">≥ ~57%</text>
  <rect x="800" y="375" width="80" height="30" rx="4" fill="#00ff8820" stroke="#00ff88" stroke-width="1"/>
  <text x="840" y="387" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="700">≤ ~40%</text>
  <text x="840" y="399" text-anchor="middle" fill="#00ff88" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">less</text>

  <text x="450" y="490" text-anchor="middle" fill="#444444" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="8">Conceptual architecture by Alp Eren Celebi · All parameters are placeholders to be replaced with device data</text>
</svg>
